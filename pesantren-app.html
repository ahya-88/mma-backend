<head>

<title>Sistem Informasi Terpadu — Ma'had Mudaiyatul Anwar</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<!-- URL backend live (Railway) — override tanpa build ulang dengan menimpa window.BACKEND_API_BASE
     SEBELUM tag bundle di bawah, kalau backend pindah domain. -->
<script>
  window.BACKEND_API_BASE = window.BACKEND_API_BASE || window.location.origin + "/api";
  window.addEventListener("error", function(e) {
    if (window.Sentry) {
      try { window.Sentry.captureException(e.error || e.message); } catch (_) {}
    }
  });

  // Fast In-Memory API Cache Interceptor untuk menghilangkan delay loading saat berpindah panel
  (() => {
    const apiCache = new Map();
    const CACHE_TTL_MS = 10000; // 10 detik cache untuk transisi instan antar tab namun tetap fresh
    const originalFetch = window.fetch.bind(window);

    window.clearMmaApiCache = () => {
      apiCache.clear();
    };

    window.fetch = async (...args) => {
      const input = args[0];
      const init = args[1] || {};
      const method = ((init.method || "GET") + "").toUpperCase();
      const url = typeof input === "string" ? input : input?.url || "";

      // Jika operasi mutasi (POST, PUT, DELETE, PATCH): bersihkan cache agar data selalu mutakhir
      if (["POST", "PUT", "DELETE", "PATCH"].includes(method)) {
        apiCache.clear();
        return originalFetch(...args);
      }

      // Hanya cache GET endpoint data yang bukan auth
      const isCacheableGet = method === "GET" && (url.includes("/api/") || url.includes("/santri") || url.includes("/pengasuhan") || url.includes("/pengajaran") || url.includes("/lptq") || url.includes("/keuangan")) && !url.includes("/auth/");

      if (isCacheableGet) {
        let authHeader = "";
        if (init.headers instanceof Headers) {
          authHeader = init.headers.get("Authorization") || "";
        } else if (typeof init.headers === "object") {
          authHeader = init.headers.Authorization || init.headers.authorization || "";
        }
        const cacheKey = `${url}::${authHeader}`;
        const cached = apiCache.get(cacheKey);
        const now = Date.now();

        if (cached && (now - cached.timestamp < CACHE_TTL_MS)) {
          return cached.response.clone();
        }

        const res = await originalFetch(...args);
        if (res.ok) {
          apiCache.set(cacheKey, {
            timestamp: now,
            response: res.clone()
          });
        }
        return res;
      }

      return originalFetch(...args);
    };
  })();
</script>
<style>
  body { margin: 0; font-family: "Inter", sans-serif; }
  #root { min-height: 100vh; }
</style>
<style>
  :root {
    color-scheme: light;
    --ui-ink: var(--c-text, #1d302d);
    --ui-line: var(--c-border, #dce6e1);
    --ui-green: var(--c-primary, #0c4a6e);
    --ui-focus: color-mix(in srgb, var(--ui-green) 20%, transparent);
  }

  body {
    color: var(--ui-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button,
  a,
  input,
  select,
  textarea {
    transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease,
      box-shadow 160ms ease, transform 160ms ease;
  }

  :where(#root input:not([type="checkbox"]):not([type="radio"])),
  :where(#root select),
  :where(#root textarea) {
    border-color: var(--ui-line);
    border-radius: 9px;
    background-color: #fff;
    color: var(--ui-ink);
  }

  :where(#root input::placeholder),
  :where(#root textarea::placeholder) {
    color: #879590;
  }

  :where(#root input:focus),
  :where(#root select:focus),
  :where(#root textarea:focus) {
    border-color: var(--ui-green);
    outline: 3px solid var(--ui-focus);
    outline-offset: 1px;
    box-shadow: none;
  }

  button {
    border-radius: 8px;
  }

  button:focus-visible,
  a:focus-visible {
    outline: 3px solid var(--ui-focus);
    outline-offset: 2px;
  }

  #root .glass-card {
    border: 1px solid color-mix(in srgb, var(--c-border, #dce6e1) 80%, white) !important;
    border-radius: 14px !important;
    background: rgba(255, 255, 253, 0.88) !important;
    box-shadow: 0 14px 36px rgb(var(--c-primary-rgb, 12 74 110) / 0.075), 0 2px 6px rgb(var(--c-primary-rgb, 12 74 110) / 0.035) !important;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
  }

  #root .glass-card:hover {
    border-color: color-mix(in srgb, var(--c-primary, #0c4a6e) 24%, transparent) !important;
    box-shadow: 0 18px 42px rgb(var(--c-primary-rgb, 12 74 110) / 0.1), 0 3px 8px rgb(var(--c-primary-rgb, 12 74 110) / 0.045) !important;
  }

  #root .glass-dark {
    border-color: rgba(255, 255, 255, 0.16) !important;
    background: linear-gradient(145deg, color-mix(in srgb, var(--c-primary, #0c4a6e) 96%, black), color-mix(in srgb, var(--c-primary, #0c4a6e) 78%, var(--c-accent, #0284c7))) !important;
    box-shadow: 0 22px 48px rgb(var(--c-primary-rgb, 12 74 110) / 0.18) !important;
  }

  #root .gradient-primary,
  #root .btn-gradient {
    background: linear-gradient(128deg, var(--c-accent, #0284c7) 0%, var(--c-primary, #0c4a6e) 58%, color-mix(in srgb, var(--c-primary, #0c4a6e) 55%, var(--c-accent, #0284c7)) 100%) !important;
  }

  #root .btn-gradient {
    border: 1px solid rgba(255, 255, 255, 0.16) !important;
    box-shadow: 0 8px 18px rgb(var(--c-primary-rgb, 12 74 110) / 0.2) !important;
  }

  #root .btn-gradient:hover {
    box-shadow: 0 12px 24px rgb(var(--c-primary-rgb, 12 74 110) / 0.26) !important;
    transform: translateY(-2px);
  }

  :where(#root) h1,
  :where(#root) h2,
  :where(#root) h3,
  :where(#root) h4 {
    color: var(--c-text, var(--ui-ink));
    text-wrap: balance;
  }

  #root .hero-panel {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 80% 14%, color-mix(in srgb, var(--c-accent-bg, #d5e8d9) 28%, transparent), transparent 32%),
      linear-gradient(145deg, var(--c-primary, #173c31) 0%, color-mix(in srgb, var(--c-primary, #173c31) 70%, var(--c-accent, #205b49)) 58%, var(--c-accent, #397b5d) 100%) !important;
  }

  #root .hero-panel::after {
    position: absolute;
    inset: 0;
    content: "";
    pointer-events: none;
    opacity: 0.16;
    background-image: repeating-linear-gradient(135deg, transparent 0 18px, rgba(255, 255, 255, 0.13) 18px 19px, transparent 19px 38px);
    mask-image: linear-gradient(115deg, transparent 10%, #000 100%);
  }

  @media (min-width: 1024px) {
    #root .hero-panel.text-lg {
      position: static !important;
      display: block !important;
      width: auto !important;
      overflow: visible !important;
      background: none !important;
    }

    #root .hero-panel.text-lg::after {
      content: none;
    }
  }

  #root button:not(:disabled) {
    cursor: pointer;
  }

  #root button:disabled {
    cursor: not-allowed;
  }

  #root table {
    border-collapse: separate !important;
    border-spacing: 0 !important;
    border-radius: 12px;
    overflow: hidden;
  }

  :where(#root) table thead th {
    background: linear-gradient(180deg, #f8fafc 0%, #edf2f7 100%) !important;
    color: #334155 !important;
    font-size: 11px !important;
    font-weight: 700 !important;
    letter-spacing: 0.07em !important;
    text-transform: uppercase !important;
    padding: 12px 14px !important;
    border-bottom: 2px solid #cbd5e1 !important;
  }

  #root table tbody tr {
    transition: background-color 160ms ease;
  }

  #root table tbody tr:nth-child(even) {
    background-color: rgba(248, 250, 252, 0.7);
  }

  #root table tbody tr:nth-child(odd) {
    background-color: #ffffff;
  }

  :where(#root) table tbody tr:hover {
    background-color: #f0f9ff !important;
    box-shadow: inset 4px 0 0 #0284c7 !important;
  }

  #root ::selection {
    color: var(--c-primary, #173c31);
    background: color-mix(in srgb, var(--c-accent, #0c4a6e) 22%, white);
  }

  #root .wali-biodata-card .px-5.pb-5 > .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px 10px;
  }

  #root .wali-biodata-card .px-5.pb-5 > .grid > p,
  #root .wali-biodata-card .px-5.pb-5 > .grid > div {
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--c-border-soft, #e5ece8);
    border-radius: 8px;
    background: color-mix(in srgb, var(--c-page-bg, #f8faf9) 55%, white);
    line-height: 1.45;
    overflow-wrap: anywhere;
  }

  #root .wali-biodata-card .px-5.pb-5 > .grid > p > span,
  #root .wali-biodata-card .px-5.pb-5 > .grid > div > span {
    display: block;
    margin-bottom: 2px;
    color: var(--c-muted, #64746d) !important;
    font-size: 10px;
    font-weight: 600;
  }

  #root .wali-biodata-card .px-5.pb-5 > .grid > :nth-child(n + 7) {
    grid-column: 1 / -1;
  }

  @media (max-width: 420px) {
    #root .wali-biodata-card .px-5.pb-5 > .grid {
      grid-template-columns: 1fr;
    }
  }

  :where(#root) table thead {
    color: var(--c-muted, #42564f);
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

<script>
(() => {
  const root = document.getElementById("root");
  if (!root) return;

  const markWaliBiodata = () => {
    root.querySelectorAll("h3").forEach((heading) => {
      if (heading.textContent.trim() === "Biodata Santri") {
        heading.closest(".animate-riseIn")?.classList.add("wali-biodata-card");
      }
    });
  };

  let debounceTimer = null;
  const debouncedMark = () => {
    if (debounceTimer) return;
    debounceTimer = setTimeout(() => {
      debounceTimer = null;
      markWaliBiodata();
    }, 80);
  };

  new MutationObserver(debouncedMark).observe(root, {
    childList: true,
    subtree: true,
  });
  markWaliBiodata();
})();
</script>
